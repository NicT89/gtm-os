# CodeRabbit configuration for gtm-os.
#
# This repo is mostly prose playbooks (skills/*/SKILL.md) plus a small amount of
# deterministic Python. The settings below aim review at the things that can
# actually break an installed copy, and turn off the ones that report style
# opinions on documentation.

language: en-US

reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  poem: false

  path_filters:
    # scripts/fanout_workflow.js is deliberately NOT excluded here.
    #
    # The first version of this config filtered it out, on the reasoning that a
    # module parser reports its required top-level `return` as illegal. That was
    # the wrong trade: reviewing that file produced the most valuable finding of
    # the first pass (untrusted scraped content interpolated beside Airtable tool
    # instructions, CWE-74), and excluding it would have suppressed that while
    # only saving one false positive. The known-false syntax findings are
    # suppressed by path_instructions below instead, which is narrower.

    # Generated and vendored noise.
    - "!**/__pycache__/**"
    - "!**/*.pyc"

  path_instructions:
    - path: "skills/**/SKILL.md"
      instructions: >
        These are agent instructions, not documentation. Review them for
        operational safety, not prose style. Flag: a step that automates past a
        named human gate (ICP sign-off, credit spend, pre-send review); a
        credit-consuming action that does not state its cost before spending; a
        hardcoded deployment ID where a single-brace {KEY} token belongs; a
        missing or blocking version-check preamble; setup instructions written
        inline instead of routing to the environment-setup skill; and a
        `description` that summarizes behavior without carrying the trigger
        phrases a user would actually say. Do not flag long prose, repetition
        across skills, or tone.

    - path: "references/**/*.md"
      instructions: >
        Shared reference material cited by multiple skills. Flag factual
        contradictions with the skills that cite them, single-brace {KEY} tokens
        that do not exist in instance-config.example.json, and any real client
        name, credential, or workspace ID (base app…, table tbl…, field fld…,
        record rec…, or a 24-char hex CRM field ID). Placeholder forms like
        appXXXXXXXXXXXXXX are intentional and fine.

    - path: "scripts/**/*.py"
      instructions: >
        House shape is: standard library only, a module docstring with usage, and exit codes
        0 pass / 1 fail / 2 usage error. Output is PROSE BY DEFAULT with a `--json` flag for
        machine consumers; that is the shape every script in this repo actually has
        (scan_secrets, setup_status, setup_feedback, gap_ledger) because a human reads the
        default path. Do not flag a prose default as a departure, and do not ask for JSON on
        stdout unconditionally.

        Flag a validator that cannot fail — a check that always passes reads as a gate while
        being none. That is the highest-value finding class in this repo and it has been hit
        four times.

    - path: ".claude-plugin/plugin.json"
      instructions: >
        Since 1.7.1 a release PR bumps BOTH `VERSION` and this manifest's `version`, in the
        same commit, and `scripts/check_version_sync.py` fails CI when they disagree. The
        release workflow no longer pushes a sync commit to main, because that bot push was
        the one thing preventing `main` from requiring a pull request. Do NOT advise leaving
        the manifest to the release process; that is the pre-1.7.1 convention.

    - path: "tests/**/*.py"
      instructions: >
        These pin each way a validator is supposed to FAIL. Flag a test that
        would still pass if the behavior it names were removed.

    - path: "**/*.md"
      instructions: >
        Two standing rules of this repo are easy to over- and under-apply.

        "Do not invent numbers" targets VERIFIABLE claims: a metric in outreach
        copy, a headcount, a funding figure, a vendor's stated limit, a
        concurrency cap. A number with no source is a defect there, because the
        skills forbid fabricating one for a prospect and the repo holds itself to
        the same bar. It is NOT a ban on colloquial duration: "an afternoon, not a
        click" and "worth ten minutes" are idiom, not claims, and flagging them
        strips useful writing without protecting anything. Flag an unsourced
        number when a reader could act on it as fact.

        "No client data" means real CLIENT and PROSPECT names: companies the operator
        sells to or researches. That holds even inside a war story about a production
        incident, so describe the incident and anonymize the company. Synthetic names
        (Cobalt Systems, Harbor Labs, Meridian Data) and .example domains are correct and
        must not be flagged. This repo has never carried a real client name.

        VENDOR names are not client data and must never be flagged as such. Apollo,
        Airtable, Apify, Firecrawl, HubSpot, Salesforce, Clay, ZoomInfo, Snowflake, CB
        Insights and the rest are the tools this engine integrates with, and they are named
        by necessity throughout: the coverage map, the platform-support tiers, the credit
        table, and the CRM_PROVIDER key itself all depend on naming them exactly.
        Anonymizing a vendor makes the document useless.

    - path: "scripts/fanout_workflow.js"
      instructions: >
        Do NOT report the top-level `return`, the top-level `await`, or the
        undefined globals (args, log, phase, agent, pipeline) as defects. This is
        not an ES module; it is a script body that the host Workflow tool wraps in
        an async function before executing, which is what makes all of those
        legal. The `return` is how a workflow yields its result, so every
        suggestion to remove it, or to wrap the body in a function, is a
        regression that silently makes the run return nothing.

        It IS syntax-checked in CI by scripts/check_workflow_script.py. Note that
        `node --check` is useless here: node stops checking entirely once it sees
        `export` in a .js file and exits 0 on a file with a real syntax error.

        Do review its prompt construction: untrusted scraped content must stay
        fenced and labeled as data, the writer's tool scope must stay pinned to
        the named records, and its instructions must match
        references/research-vault.md (especially supersede-vs-coexist).

  knowledge_base:
    learnings:
      scope: local

  auto_review:
    enabled: true
    drafts: false

chat:
  auto_reply: true
